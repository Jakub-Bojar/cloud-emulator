# ============================================================================
# Controller pod + service + RBAC
# ============================================================================
# The controller is the public entry point. Exposed as NodePort here so you
# can hit it from your laptop while developing; switch to ClusterIP/Ingress
# in production.
#
# The controller needs Kubernetes API access for the template materialiser
# (controller/materialiser.py), which creates, updates, and deletes
# ConfigMaps, Deployments, and Services to stand up the topologies posted to
# /templates or declared via labelled template ConfigMaps.
#
# The Role below grants that. It's namespace-scoped (not cluster-wide)
# and intentionally NOT bound to specific resource names — the
# materialiser makes up names at runtime. The materialiser label-scopes
# its own deletes via `labelSelector` so it can only ever touch
# resources it created.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-emulator
rules:
  # ConfigMaps: materialised per-role configs + watching labelled template
  # ConfigMaps for declarative ingestion.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # Services fronting each role.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]
  # Endpoints — read-only. The materialiser reads these to enumerate
  # concrete backend pod IPs and write them into source-role ConfigMaps,
  # so iperf3 clients can hit specific pods rather than the Service
  # (avoiding the TCP-stickiness fan-out problem).
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  # Pods — read-only. The /api/v1 status + overview endpoints read live pod
  # state (phase, readiness, restart count, node, age) to fuse with the
  # scraped worker metrics.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The Deployment per role.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-emulator
subjects:
  - kind: ServiceAccount
    name: controller-sa
roleRef:
  kind: Role
  name: controller-emulator
  apiGroup: rbac.authorization.k8s.io
---
# nodes are cluster-scoped, so listing them needs a ClusterRole (a namespaced
# Role's rules for a cluster-scoped resource are ignored). netem.py's
# _nodes_by_site() reads /api/v1/nodes to find each site's InternalIP for tc
# shaping — without this, node discovery 403s and shaping silently no-ops.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller-emulator-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-emulator-nodes
subjects:
  # ClusterRoleBindings aren't scoped by the manifest's apply namespace, so
  # the ServiceAccount's namespace must be given explicitly.
  - kind: ServiceAccount
    name: controller-sa
    namespace: cloud-native-emulator
roleRef:
  kind: ClusterRole
  name: controller-emulator-nodes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: controller
  labels:
    app: controller
spec:
  serviceAccountName: controller-sa
  # Plain in-cluster Pod — schedules on any available node. If you run a
  # multi-tier cluster and want to keep the controller off the emulated tier
  # nodes, add a nodeSelector/toleration for your control node here; nothing in
  # the controller requires a particular node.
  #
  # A bare Pod (not a Deployment) is intentional: there is only ever one
  # controller per site. The trade-off is that it is not self-healing — if it
  # is deleted or evicted it won't be recreated (just re-apply this file), and
  # picking up a new image is a delete + re-apply rather than a rollout. On a
  # node reboot the kubelet restarts it in place, so that case is covered.
  containers:
    - name: controller
      image: jp36/emulator-controller:latest
      imagePullPolicy: Always
      ports:
        # Named so the PodMonitor in monitoring.yaml can scrape /metrics
        # (the configured inter-tier RTT) by port name.
        - name: http
          containerPort: 8081
      env:
        # Site identity — this controller's place in the larger cloud system.
        # Every observability response carries {id, tier} so a future
        # federation gateway can merge data across VMs. Set per VM.
        - name: SITE_ID
          value: "local"
        - name: SITE_TIER
          value: "cloud"
        # Local timezone for /measurements/range: naive request timestamps
        # are interpreted in it and response timestamps rendered in it
        # (with offset). Also localises log timestamps.
        - name: TZ
          value: "Europe/London"
        # Prometheus HTTP API base URL for the windowed /summary endpoint.
        # Depends on your kube-prometheus-stack release/namespace — adjust to
        # match. If unreachable, /summary degrades gracefully.
        - name: PROM_URL
          value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090"
        # Single-node testing only. When set, every worker pod is pinned to
        # this node (nodeSelector kubernetes.io/hostname=<value>), and that
        # overrides templates' `placements`/`node_site_mapping` too — on a
        # multi-node cluster it silently collapses every site onto one node.
        # Leave "" so templates decide where pods run; set it to your node's
        # name (`kubectl get nodes`) only on a one-node cluster.
        - name: DEFAULT_NODE
          value: ""
      # TCP check rather than HTTP: /health was merged into GET /overview,
      # which does k8s API + Prometheus work — too heavy to hit every probe
      # period. Accepting a TCP connection proves the web layer is up.
      readinessProbe:
        tcpSocket: { port: 8081 }
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: controller-service
spec:
  selector:
    app: controller
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort

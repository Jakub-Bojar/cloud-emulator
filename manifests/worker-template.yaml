# ============================================================================
# Worker-template blueprint (parameterized)
# ============================================================================
# This file is NOT meant to be `kubectl apply`-ed directly. The controller
# reads it as a stencil: for each app in a posted template it substitutes
# the placeholders below and POSTs the resulting objects to the Kubernetes
# API. Keeping the blueprint as a real YAML file lets you read, edit, and
# lint it without touching controller code.
#
# Placeholders the controller substitutes:
#   __TEMPLATE__   the template's name        (e.g. "frontend-backend")
#   __ROLE__       the app's name             (e.g. "frontend")
#   __COUNT__      replicas for this app      (e.g. "3")
#   __IMAGE__      worker image + tag         (e.g. "jp36/emulator-worker:latest")
#
# Per template, the controller creates one (ConfigMap + Deployment + Service)
# group per app. (At the k8s level each app is still labelled `role=<app>`, so
# the __ROLE__ placeholder and the wt-<template>-<app> resource names are
# unchanged.) For a template named "demo" with apps "frontend" and "backend"
# the cluster ends up with:
#
#   ConfigMap/wt-demo-frontend-config   Deployment/wt-demo-frontend   Service/wt-demo-frontend
#   ConfigMap/wt-demo-backend-config    Deployment/wt-demo-backend    Service/wt-demo-backend
#
# ----------------------------------------------------------------------------
# Example /template POST body
# ----------------------------------------------------------------------------
# {
#   "name": "frontend-backend",
#   "x": 50,
#   "node_site_mapping": [
#     { "k8s_node": "edge-1",  "site_name": "site-A" },
#     { "k8s_node": "cloud-1", "site_name": "site-B" }
#   ],
#   "network_links": [
#     { "from": "site-A", "to": "site-B", "rtt_ms": 100, "bandwidth_mbps": 500 }
#   ],
#   "apps": {
#     "frontend": {
#       "cpu": {"a": 20, "b": 200},
#       "ram": {"a": 8,  "b": 128},
#       "net": {"a": 0.5, "b": 5},
#       "placements": [ { "site": "site-A", "count": 1 } ]
#     },
#     "backend": {
#       "cpu": {"a": 5, "b": 50},
#       "ram": {"a": 2, "b": 32},
#       "net": {"a": 0.1, "b": 1},
#       "placements": [ { "site": "site-B", "count": 3 } ]
#     }
#   },
#   "edges": [
#     { "from": "frontend", "to": "backend" }
#   ]
# }
#
# `edges` are directional app-to-app links: every pod of `from` sends iperf3
# traffic to the Service of `to`. So `frontend -> backend` with backend.count
# = 3 is a 1-to-many fan-out (k8s Service round-robins TCP connects across
# backend pods). A many-to-many mesh is expressed as multiple edges.
#
# `node_site_mapping` (optional, top-level) is the template's own site → k8s
# node registry: each entry maps a real Kubernetes node name to a logical site
# name used by `placements` and `network_links`. This replaces node labelling
# entirely — the controller pins pods directly by hostname
# (nodeSelector kubernetes.io/hostname), so no `kubectl label node` step is
# needed. `network_links` declares the round-trip time (rtt_ms) and optional
# bandwidth cap (bandwidth_mbps) between site pairs — the controller applies
# these with `tc netem`/`htb` on each site's node NIC (controller/netem.py);
# see TEMPLATE.md and API.md.
#
# Per app, `placements` (array) is the site-based placement form: each entry's
# `site`/`sites` name must appear in `node_site_mapping`, resolved to a real
# node and pinned there — one Deployment per site, counts summed to give the
# app's total replica count. The legacy singular `placement` (object) form
# still works unchanged for raw node-label/hostname placement without
# `node_site_mapping`: `{"on": {label: value}}`, `{"node": "hostname"}`, or
# `{"nodes": [{"node", "count"}]}`. An app uses one or the other, never both.
# `DEFAULT_NODE` (controller env, not a template field) is the fallback node
# for an app with neither — handy for single-node testing; it overrides
# `placements`' site resolution entirely.
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wt-__TEMPLATE__-__ROLE__-config
  labels:
    app.kubernetes.io/managed-by: emulator-controller
    template: __TEMPLATE__
    role: __ROLE__
data:
  # Default: zero load, no peers. The controller overwrites `data.config.json`
  # right after creation with the role's real formulas + the peer list it
  # computes from the template's edges.
  config.json: |
    {
      "x": 0,
      "cpu": { "a": 0, "b": 0 },
      "ram": { "a": 0, "b": 0 },
      "net": { "a": 0, "b": 0 },
      "peers": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wt-__TEMPLATE__-__ROLE__
  labels:
    app.kubernetes.io/managed-by: emulator-controller
    template: __TEMPLATE__
    role: __ROLE__
spec:
  replicas: __COUNT__
  selector:
    matchLabels:
      template: __TEMPLATE__
      role: __ROLE__
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: emulator-controller
        template: __TEMPLATE__
        role: __ROLE__
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            # The worker uses POD_NAME to deterministically pick which
            # port in each peer's iperf3 server pool it connects to, so
            # multiple source pods sending to the same target distribute
            # across the pool instead of all colliding on port 9999.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Size of the iperf3 server pool. Each port = ~1.2 MiB
            # resident, so this directly contributes to the worker's
            # RAM baseline. Larger pool tolerates more concurrent
            # inbound peers (useful for many-to-many topologies) at the
            # cost of higher baseline RAM. 2 is enough for 1-to-many
            # fan-out; bump to 8+ for many-to-many.
            - name: IPERF_PORT_COUNT
              value: "2"
            # UDP datagram length for the iperf3 net generator (the `-l` flag).
            # Larger datagrams carry the same Mbps in far fewer syscalls, which
            # cuts the CPU floor a net-heavy pod would otherwise have. "" / "0"
            # falls back to iperf3's default. Only applies when the net transport
            # is UDP — the default; set NET_PROTOCOL=tcp here to switch to TCP.
            - name: IPERF_UDP_LEN
              value: "32K"
            # stress-ng --cpu-load duty-cycle slice (ms). Small values break
            # the busy/idle loading into fine slices for much smoother CPU and
            # better load accuracy when pods share a node (stress-ng's default
            # cycles in coarse ~0.5s chunks and is bursty). "0" = default.
            - name: CPU_LOAD_SLICE_MS
              value: "40"
            # CPU feedback loop (closed-loop sizing). stress-ng is seeded at
            # configure() time then continuously re-sized so the pod's TOTAL
            # CPU converges on target — this fixes pods that used to stick
            # below target when their one-shot baseline sample was taken during
            # startup churn. All three have safe code defaults; they're surfaced
            # here only so they can be tuned without a rebuild.
            #   CPU_GAIN               fraction of error closed per step (0.6)
            #   CPU_ADJUST_INTERVAL_S  seconds between corrections; keep >= the
            #                          15 s rolling CPU window (15)
            #   CPU_TOLERANCE_MC       deadband floor in millicores (5, set below —
            #                          code default is 15 if unset)
            - name: CPU_GAIN
              value: "0.6"
            - name: CPU_ADJUST_INTERVAL_S
              value: "15"
            - name: CPU_TOLERANCE_MC
              value: "5"
          ports:
            # HTTP control / status / Prometheus metrics.
            - { name: http,   containerPort: 8080 }
            # iperf3 server pool entry point (9999). The worker also
            # binds 10000..10006 internally — these don't need to be
            # individually declared as containerPorts (declarations are
            # advisory in k8s; the Service below uses targetPort: 9999).
            - { name: iperf3, containerPort: 9999 }
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/emulator
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: wt-__TEMPLATE__-__ROLE__-config
---
apiVersion: v1
kind: Service
metadata:
  name: wt-__TEMPLATE__-__ROLE__
  labels:
    app.kubernetes.io/managed-by: emulator-controller
    template: __TEMPLATE__
    role: __ROLE__
spec:
  selector:
    template: __TEMPLATE__
    role: __ROLE__
  ports:
    - { name: http,   port: 8080, targetPort: 8080 }
    - { name: iperf3, port: 9999, targetPort: 9999 }
  type: ClusterIP
